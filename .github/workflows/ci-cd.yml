name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Linting and Security Checks
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd wedonet-backend && npm ci --ignore-scripts
          cd ../wedonet-frontend && npm ci --ignore-scripts

      - name: Lint Backend
        run: |
          cd wedonet-backend
          npm run lint

      - name: Lint Frontend
        run: |
          cd wedonet-frontend
          npm run lint

      - name: Security Audit
        run: |
          npm audit --audit-level moderate
          cd wedonet-backend && npm audit --audit-level moderate
          cd ../wedonet-frontend && npm audit --audit-level moderate

      - name: Check for vulnerabilities with Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # Backend Tests
  test-backend:
    runs-on: ubuntu-latest
    needs: lint-and-security
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Backend Dependencies
        run: |
          cd wedonet-backend
          npm ci --ignore-scripts

      - name: Run Backend Tests
        run: |
          cd wedonet-backend
          npm test
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Generate Coverage Report
        run: |
          cd wedonet-backend
          npm run test:coverage || true

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./wedonet-backend/coverage/lcov.info
          flags: backend

  # Frontend Tests
  test-frontend:
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd wedonet-frontend
          npm ci --ignore-scripts

      - name: Run Frontend Tests
        run: |
          cd wedonet-frontend
          npm run test:coverage
        env:
          CI: true

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./wedonet-frontend/coverage/lcov.info
          flags: frontend

  # Build and Test Docker Images
  build-and-test:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./wedonet-backend
          push: false
          tags: wedonet-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./wedonet-frontend
          push: false
          tags: wedonet-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Compose
        run: |
          cp .env.example .env
          docker-compose config
          docker-compose up -d --build
          
          # Wait for services to start
          sleep 30
          
          # Test backend health
          curl -f http://localhost:3001/health || exit 1
          
          # Test frontend accessibility
          curl -f http://localhost:3000 || exit 1
          
          # Cleanup
          docker-compose down -v

  # E2E Tests with Playwright
  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Start Application
        run: |
          cp .env.example .env
          docker-compose up -d --build
          
          # Wait for services
          timeout 120s bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'
          timeout 120s bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Run E2E Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            Automated release from main branch
            
            Changes in this release:
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false